[project]
name = "ai-engine"
version = "0.0.0"
description = "BusinessPilot AI engine (FastAPI). No direct access to tenant data stores."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "opentelemetry-api>=1.28",
  "opentelemetry-sdk>=1.28",
  "opentelemetry-exporter-otlp-proto-http>=1.28",
  "opentelemetry-instrumentation-fastapi>=0.49b0",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.8", "mypy>=1.13"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Do not depend on the editable-install .pth file: macOS can flag it hidden, and Python then ignores it.
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
strict = true
files = ["src", "tests"]
mypy_path = "src"
